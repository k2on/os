# Builds the generic Apple Silicon installer ISO (modules/installer/asahi.nix)
# natively on GitHub's arm64 runner and uploads it as the run's artifact.
#
# Nothing it builds is secret: it checks out without the secrets submodule,
# and the flake leaves secrets/ out when it is not there.
name: asahi-installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.lock
      - modules/installer/asahi.nix
      - .github/workflows/asahi-installer.yml
  pull_request:
    paths:
      - flake.lock
      - modules/installer/asahi.nix
      - .github/workflows/asahi-installer.yml

permissions:
  contents: read

concurrency:
  group: asahi-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # The Asahi kernel and ZFS's kernel module are not in cache.nixos.org;
    # without a hit in k2on.cachix.org both build from source.
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      # Pulls from and pushes to k2on.cachix.org, so the Asahi kernel and
      # ZFS's module build once per flake.lock bump rather than every run.
      # Pushing needs the CACHIX_AUTH_TOKEN repo secret; without it (as on a
      # fork's pull request) the cache is only read. The ISO and its squashfs
      # are left out: they change with any edit and would fill the cache.
      - uses: cachix/cachix-action@v16
        with:
          name: k2on
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(\.iso$|squashfs\.img$|-source$)'

      - name: Build ISO
        run: |
          nix build -L .#packages.aarch64-linux.asahi-installer
          mkdir out
          cp result/iso/*.iso out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: asahi-installer
          path: out/*.iso
          compression-level: 0
          retention-days: 30
