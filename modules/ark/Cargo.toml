# One workspace for everything Rust under modules/ark: the `ark` CLI (cli/)
# and the services' daemons (services/<name>/sync). Build a member with
# `pkgs.callPackage ./_rust.nix { pname = "..."; }`, or `cargo build -p ...`
# from here. Service commands for the CLI are not members: cli/build.rs
# compiles services/<name>/cli/mod.rs straight into the `ark` crate.
[workspace]
resolver = "2"
members = [
  "cli",
  "services/money/sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# the CLI only
anyhow = "1"
# unstable-ext: Arg::add, for clap_complete's per-argument value candidates
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "unstable-ext"] }
# unstable-dynamic: `COMPLETE=zsh ark` prints a shell shim that asks the binary itself for completions
clap_complete = { version = "4", default-features = false, features = ["unstable-dynamic"] }
rpassword = "7"
