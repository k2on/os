# One workspace for everything Rust under modules/ark: the `ark` CLI (cli/)
# and the services' daemons (services/<name>/sync, services/sivrad/channel). Build a member with
# `pkgs.callPackage ./_rust.nix { pname = "..."; }`, or `cargo build -p ...`
# from here. Service commands for the CLI are not members: cli/build.rs
# compiles services/<name>/cli/mod.rs straight into the `ark` crate.
[workspace]
resolver = "2"
members = [
  "cli",
  "services/sivrad/channel",
  "llm-proxy",
  "services/sivrad/browser",
  "services/pass/vaults",
  "services/mail/aliases",
  "services/photos/avatars",
  "services/devices/apple/enroll",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# llm-proxy: the client side of hyper, to forward requests upstream
# sivrad-browser: a WebSocket client, for the Chrome DevTools Protocol
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# the CLI only
anyhow = "1"
# unstable-ext: Arg::add, for clap_complete's per-argument value candidates
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "unstable-ext"] }
# unstable-dynamic: `COMPLETE=zsh ark` prints a shell shim that asks the binary itself for completions
clap_complete = { version = "4", default-features = false, features = ["unstable-dynamic"] }
rpassword = "7"
# sivrad-channel and llm-proxy: async sockets, HTTP both ways, SHA-256 and
# random ids (ring is already here through ureq's rustls)
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "time", "macros", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "0.1"
ring = "0.17"
